
<div id="alarm-content">
 
	<table id="alarm-table">
	   <thead>
	   <tr>
		  <!-- <th class="order-col">#</th> -->
		  <th class="name-col">Name</th>
          <th>Threshold/Status</th>
		  <th>Value</th>
		  <th>Unit</th>
          <th></th>
	   </tr>
	   </thead>
	   <tbody id="tbody">
           <tr class="row-2">
               <td>SDN 1 Current High</td>
               <td><label id="lbl300"></label></td>
               <td>                    
                    <input id="300" type="text" spellcheck="false" value="" class="adi-field-input , number" tooltip="ABC" style="width: 100px;" autocomplete="off"  onpaste="fnOnPaste_CurentHigh(event);">                   
                </td>
               <td>Amps</td>
               <td><button id="btnSDN1CURRENT" class="adi-setbtn" onclick="btnSDN1CURRENT_HIGH()">Update</button></td>
           </tr>
           <tr class="row-1">
               <td>SDN 1 Temperature High</td>
               <td><label id="lbl301"></label></td>
               <td><input id="301" type="text" spellcheck="false" value="" class="adi-field-input , numberTemp" style="width: 100px;" autocomplete="off" onpaste="fnOnPaste_TempHigh(event);"></td>
               <td>
                <div>
                 <select name="cbSDN1TempHigh" id="cbSDN1TempHigh">
                     <option value="dC">&#8451</option>
                     <option value="dF">&#8457</option>
                 </select>
                </div>
                </td>
               <td><button id="btnSDN1TempHigh" class="adi-setbtn" onclick="btnSDN1TempHigh_Click()">Update</button></td>
           </tr>
           <tr class="row-2">
               <td>SDN 2 Current High</td>
               <td><label id="lbl316"></label></td>
               <td><input id="316" type="text" spellcheck="false" value="" class="adi-field-input , number" style="width: 100px; " autocomplete="off" onpaste="fnOnPaste_CurentHigh(event);"></td>
               <td>Amps</td>
               <td><button id="btnSDN2CURRENT" class="adi-setbtn" onclick="btnSDN2CURRENT_HIGH()">Update</button></td>
           </tr>
           <tr class="row-1">
               <td>SDN 2 Temperature High</td>
               <td><label id="lbl317"></label></td>
               <td><input id="317" type="text" spellcheck="false" value="" class="adi-field-input , numberTemp" style="width: 100px;" autocomplete="off" onpaste="fnOnPaste_TempHigh(event);"></td>
               <td>
                   <div>
                    <select name="cbSDN2TempHigh" id="cbSDN2TempHigh">
                        <option value="dC" selected>&#8451</option>
                        <option value="dF">&#8457</option>
                    </select>
                   </div>
               </td>
               <td><button id="btnSDN2TempHigh" class="adi-setbtn" onclick="btnSDN2TempHigh_Click()">Update</button></td>
           </tr>
            <tr class="row-2">
               <td>SDN 1 Alarm Flag (P1| Enable Alarm)</td>
               <td><label id="lblChk_P1_Alarm"></label></td>
               <td>
                   <!-- <input id="chkbP1AlarmEnb" type="checkbox" class="adi-field-checkbox"> -->
                   <select id="cbP1Alarm" name="cbP1Alarm" style="width: 100px;">
                       <option value="-1">------Select------</option>
                       <option value="01">Enable</option>
                       <option value="00">Disable</option>
                   </select>                
                </td>
               <td></td>
               <td><button id="btnP1AlarmEnb" class="adi-setbtn" onclick="P1AlarmEnb()">Update</button></td>
           </tr>
          <tr class="row-1">
               <td>SDN 2 Alarm Flag (P2| Enable Alarm)</td>
               <td><label id="lblChk_P2_Alarm"></label></td>
               <td>
                   <!-- <input id="chkbP2AlarmEnb" type="checkbox" class="adi-field-checkbox"> -->
                    <select id="cbP2Alarm" name="cbP2Alarm" style="width: 100px;">
                        <option value="-1">------Select------</option>
                        <option value="01">Enable</option>
                        <option value="00">Disable</option>
                    </select>
               </td>
               <td></td>
               <td><button id="P2AlarmEnb" class="adi-setbtn" onclick="P2AlarmEnb()">Update</button></td>
           </tr>
	   </tbody>
	</table>   
    
</div>

<script type="text/javascript">
	$.getScript('/web1/pages/alarm.js');
</script>
