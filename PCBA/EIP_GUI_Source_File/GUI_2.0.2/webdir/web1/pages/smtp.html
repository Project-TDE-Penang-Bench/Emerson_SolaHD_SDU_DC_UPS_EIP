<div id="smtp-content">
	<div id="smtp-form-content"></div>   
	<button id="save" class="flat-button">Save settings</button>
	<div id="smtp-status"></div>
</div>
	<script type="text/x-tmpl" id="tmpl-smtp">
		<form id="smtp-form">
			<table>
				<tbody>
					<tr>
						<th colspan="2">SMTP configuration</th>
					</tr>
					<tr class="row-1">
						<td class="long">Server:</td>
						<td>
							<input class="stdinput" type="text" name="server" value="{%=o.server%}" />
						</td>
					</tr>
					<tr class="row-2">
						<td>User:</td>
						<td>
							<input class="stdinput" type="text" name="user" value="{%=o.user%}" />
						</td>
					</tr>
					<tr class="row-1">
						<td>Password:</td>
						<td>
							<input class="stdinput" type="Password" id="password" name="password" />
						</td>
					</tr>
					<tr class="row-2">
						<td>Confirm password:</td>
						<td>
							<input class="stdinput" type="Password" id="confirm" />
						</td>
					</tr>
				</tbody>
			</table>
		</form>
	</script>
<script type="text/javascript">
	$.getScript('pages/smtp.js');
</script>
