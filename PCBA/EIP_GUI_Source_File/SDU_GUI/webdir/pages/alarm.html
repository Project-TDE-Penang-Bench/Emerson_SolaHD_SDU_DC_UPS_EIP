<div id="alarm-content">
    <table id="alarm-table">
        <tbody>
            <tr>
                <th>Description</th>
                <th>Enable/Disable</th>
                <th>Threshold</th>
                <th>Value</th>
                <th>Unit</th>
                <th></th>
            </tr>
            <tr class="row-1">
                <td>High Internal Temperature</td>
                <td><input id="cbHighIntTemp" type="checkbox" /></td>

                <td>
                    <input id="tbHighIntTemp" type="number" style="width: 122px;" />
                </td>
                <td><label id="adi-454"></label></td>

            <tr class="row-2">
                <td>Low Battery SOC Alarm</td>
                <td><input id="cbLowBatterySoCAlarm" type="checkbox" /></td>

                <td>&percnt;</td>
                <td><button id="btnLowBatterySoCAlarm" class="adi-setbtn">Update</button></td>

            <tr class="row-1">
                <td>Low Battery Runtime Alarm</td>
                <td><input id="cbLowBatteryRunTimeAlarm" type="checkbox" /></td>

                <td><input id="tbLowBatteryRunTimeAlarm" type="number" style="width: 122px;" /></td>
                <td>second</td>
