<div id="smtp-content">
	<div id="smtp-form-content"></div>
	<div id="smtp-password-form-content"></div>
	<div id="smtp-status"></div>
</div>
<script type="text/x-tmpl" id="tmpl-smtp">
	<div style="padding-bottom: 20px;">
		<form id="smtp-form">
			<table>
				<tbody>
					<tr>
						<th colspan="2">SMTP configuration</th>
					</tr>
					<tr class="row-1">
						<td class="long">Server:</td>
						<td>
							<input class="stdinput" type="text" name="hostname" id="hostname" value="{%=o.hostname%}" />
						</td>
					</tr>
					<tr class="row-2">
						<td class="long">Port:</td>
						<td>
							<input class="stdinput" type="text" name="port" id="port" value="{%=o.port%}" />
							<img class="clickable-tight" id="portinfoimg" onclick="onClickPortInfo()">
						</td>
					</tr>
					<tr class="row-1" id="tlsrow" style="display: none;">
						<td class="long">TLS:</td>
						<td>
							<select class="nwcfg-dropdown" name="usetls" id="usetls">
								<option value="disabled" {%=selected(o.tls, false)%}>Disabled</option>
								<option value="enabled" {%=selected(o.tls, true)%}>Enabled</option>
							</select>
							<img class="clickable-tight" id="tlsinfoimg" onclick="onClickUseTlsInfo()">
						</td>
					</tr>
					<tr class="row-1" id="userrow">
						<td>User:</td>
						<td>
							<input class="stdinput" type="text" name="user" value="{%=o.user%}" />
						</td>
					</tr>
				</tbody>
			</table>
		</form>
		<button id="save" class="flat-button" onclick="buttonClickFunction('save')">Save settings</button>
	</div>
</script>
<script type="text/x-tmpl" id="tmpl-smtp-password">
	<div  style="padding-bottom: 20px;">
		<form id="smtp-password-form">
			<table>
				<tbody>
					<tr>
						<th colspan="2">SMTP password</th>
					</tr>
					<tr class="row-1">
						<td class="long">Password:</td>
						<td>
							<input class="stdinput" type="Password" id="password" name="password" value="{%=o.password%}"/ onfocus="passwordOnFocusFunction(this)">
						</td>
					</tr>
					<tr class="row-2">
						<td class="long">Confirm password:</td>
						<td>
							<input class="stdinput" type="Password" id="confirm" onfocus="passwordOnFocusFunction(this)"/>
						</td>
					</tr>
				</tbody>
			</table>
		</form>
		<button id="savepswd" class="flat-button" onclick="buttonClickFunction('savepswd')">Save settings</button>
	</div>
</script>

<script type="text/javascript">
	$.getScript(webContentPath + 'pages/smtp.js');
</script>
