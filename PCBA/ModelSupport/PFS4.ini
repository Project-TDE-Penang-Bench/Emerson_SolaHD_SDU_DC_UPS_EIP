Gateway Server and Database Settings
	In this file the GatewayServer is required to be set to "localhost".
	The Database is set in this file to the appropriate name for the location of the tester.  i.e. PFSMDP4 for minnesota
	The Database must also be set to the correct location as part of the Testlink SSL Proxy Service Instalation.

	The Testlink SSL Proxy Service must be loaded onto the tester.   
	It can be verified to be loaded by checking that this folder exists on the PC 
			C:\Program Files (x86)\BEI\TestLinkSslProxyService

	To change the GatewayServer and Database Settings rerun the Installation and enter the new settings.
	The Instalation files and list of TestLink Database Names and Server Alias can be found in the location below.   



Testlink SSl Proxy Service=http://inside/support/AppTraining/PFS/Forms/AllItems.aspx
	From this location select
		TestLink SSL Proxy Service

